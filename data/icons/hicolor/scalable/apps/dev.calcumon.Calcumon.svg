<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#77767b"/>
      <stop offset="0.5" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>
  </defs>

  <!-- drop shadow -->
  <rect x="16" y="14" width="96" height="108" rx="8" fill="#000000" opacity="0.12"/>
  <rect x="16" y="13" width="96" height="108" rx="8" fill="#000000" opacity="0.08"/>

  <!-- page -->
  <rect x="16" y="12" width="96" height="108" rx="8" fill="url(#page)"/>
  <rect x="16.5" y="12.5" width="95" height="107" rx="7.5" fill="none" stroke="#000000" stroke-opacity="0.12"/>

  <!-- punched slots -->
  <g fill="#3d3846">
    <rect x="29" y="16" width="6" height="12" rx="3"/>
    <rect x="45" y="16" width="6" height="12" rx="3"/>
    <rect x="61" y="16" width="6" height="12" rx="3"/>
    <rect x="77" y="16" width="6" height="12" rx="3"/>
    <rect x="93" y="16" width="6" height="12" rx="3"/>
  </g>
  <!-- spiral rings -->
  <g fill="url(#ring)" stroke="#5e5c64" stroke-width="1">
    <rect x="30.5" y="6.5" width="3" height="18" rx="1.5"/>
    <rect x="46.5" y="6.5" width="3" height="18" rx="1.5"/>
    <rect x="62.5" y="6.5" width="3" height="18" rx="1.5"/>
    <rect x="78.5" y="6.5" width="3" height="18" rx="1.5"/>
    <rect x="94.5" y="6.5" width="3" height="18" rx="1.5"/>
  </g>

  <!-- typed lines -->
  <g fill="#5e5c64">
    <rect x="26" y="38" width="30" height="8" rx="4"/>
    <rect x="26" y="54" width="22" height="8" rx="4"/>
    <rect x="26" y="70" width="34" height="8" rx="4"/>
    <rect x="26" y="86" width="26" height="8" rx="4"/>
  </g>

  <!-- answers -->
  <g fill="#3584e4">
    <rect x="86" y="38" width="16" height="8" rx="4"/>
    <rect x="80" y="54" width="22" height="8" rx="4"/>
    <rect x="88" y="70" width="14" height="8" rx="4"/>
    <rect x="82" y="86" width="20" height="8" rx="4"/>
  </g>

  <!-- sum rule -->
  <rect x="26" y="99" width="76" height="2" rx="1" fill="#c0bfbc"/>

  <!-- total line: "=" and the result -->
  <g fill="#241f31">
    <rect x="26" y="105" width="14" height="4" rx="2"/>
    <rect x="26" y="112" width="14" height="4" rx="2"/>
  </g>
  <rect x="72" y="104" width="30" height="13" rx="6.5" fill="#2ec27e"/>
</svg>
